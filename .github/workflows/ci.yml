name: CI/CD Pipeline & DevSecOps Suite

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  python-quality-and-tests:
    name: Python Lint, Type Check & Test Suite (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies (libpcap & tshark)
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libpcap-dev tshark

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install ruff mypy pytest pytest-cov pip-audit

      - name: Code Quality & Linting (Ruff)
        run: |
          ruff check src/ tests/

      - name: Code Formatting Verification (Ruff)
        run: |
          ruff format --check src/ tests/ || true

      - name: Static Type Checking (mypy)
        run: |
          mypy src/pcap_analyzer --ignore-missing-imports

      - name: Execute Test Suite with Coverage
        env:
          PYTHONPATH: src:tests
        run: |
          pytest --cov=src/pcap_analyzer --cov-report=term-missing tests/

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          pip-audit --desc on || echo "pip-audit completed with advisory review."

  frontend-quality-and-build:
    name: Frontend Lint, Type Check & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: TypeScript & Code Quality Verification
        run: npm run lint

      - name: Compile Production Bundle
        run: npm run build

  security-and-secret-scanning:
    name: Automated Secret & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
